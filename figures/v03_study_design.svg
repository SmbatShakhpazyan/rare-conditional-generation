<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Liberation Sans, Arial, sans-serif"><text x="70" y="66" font-size="38" text-anchor="start" fill="#182b3a" font-weight="bold">Leakage controlled model comparison</text><text x="70" y="108" font-size="25" text-anchor="start" fill="#536473" font-weight="normal">Teacher and target statistics use TRAIN. Selection uses VAL. TEST evaluates frozen selected recipes.</text><rect x="60" y="180" width="440" height="190" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="280.0" y="222" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Canonical image audit</text><text x="280.0" y="263" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Identity plus exact / flip links</text><text x="280.0" y="299" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Declared near duplicate relation</text><rect x="670" y="180" width="460" height="190" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="900.0" y="222" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Union components</text><text x="900.0" y="263" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Quarantine conflicts</text><text x="900.0" y="299" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Exclude prior held out content</text><line x1="500" y1="275" x2="665" y2="275" stroke="#536473" stroke-width="4"/><polyline points="650.59,281.96 665.00,275.00 650.59,268.04" fill="none" stroke="#536473" stroke-width="4"/><rect x="1300" y="180" width="430" height="190" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1515.0" y="222" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Fixed hash assignment</text><text x="1515.0" y="263" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">No partition search</text><text x="1515.0" y="299" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Whole components stay together</text><line x1="1130" y1="275" x2="1295" y2="275" stroke="#536473" stroke-width="4"/><polyline points="1280.59,281.96 1295.00,275.00 1280.59,268.04" fill="none" stroke="#536473" stroke-width="4"/><rect x="70" y="560" width="450" height="210" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="295.0" y="602" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">TRAIN  112,615</text><text x="295.0" y="643" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Fit teacher and target statistics</text><text x="295.0" y="679" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Train each selected recipe</text><rect x="675" y="560" width="450" height="210" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="900.0" y="602" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">VAL  23,156</text><text x="900.0" y="643" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Ten checkpoints / five trajectories</text><text x="900.0" y="679" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Choose lambda kappa and EMA</text><rect x="1280" y="560" width="450" height="210" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1505.0" y="602" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">TEST  25,217</text><text x="1505.0" y="643" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Six fresh confirmation models</text><text x="1505.0" y="679" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Three fixed paired seeds</text><line x1="1500" y1="370" x2="1500" y2="475" stroke="#536473" stroke-width="4"/><polyline points="1493.04,460.59 1500.00,475.00 1506.96,460.59" fill="none" stroke="#536473" stroke-width="4"/><line x1="295" y1="475" x2="1500" y2="475" stroke="#536473" stroke-width="4"/><line x1="295" y1="475" x2="295" y2="550" stroke="#536473" stroke-width="4"/><polyline points="288.04,535.59 295.00,550.00 301.96,535.59" fill="none" stroke="#536473" stroke-width="4"/><line x1="900" y1="475" x2="900" y2="550" stroke="#536473" stroke-width="4"/><polyline points="893.04,535.59 900.00,550.00 906.96,535.59" fill="none" stroke="#536473" stroke-width="4"/><line x1="1500" y1="475" x2="1500" y2="550" stroke="#536473" stroke-width="4"/><polyline points="1493.04,535.59 1500.00,550.00 1506.96,535.59" fill="none" stroke="#536473" stroke-width="4"/><line x1="1125" y1="665" x2="1275" y2="665" stroke="#536473" stroke-width="4"/><polyline points="1260.59,671.96 1275.00,665.00 1260.59,658.04" fill="none" stroke="#536473" stroke-width="4"/><text x="900" y="910" font-size="30" text-anchor="middle" fill="#182b3a" font-weight="bold">Disjointness is guaranteed only under the declared relations.</text></g></svg>