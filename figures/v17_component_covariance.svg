<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900"><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Liberation Sans, Arial, sans-serif"><text x="70" y="66" font-size="38" text-anchor="start" fill="#182b3a" font-weight="bold">Sum group influences before squaring</text><text x="70" y="108" font-size="25" text-anchor="start" fill="#536473" font-weight="normal">Constructed two component example from the exact training-statistic definition.</text><rect x="90" y="200" width="720" height="340" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="450.0" y="242" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Common group directions cancel</text><text x="450.0" y="283" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Group influences align identically</text><text x="450.0" y="319" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Signed component totals: 0 and 0</text><text x="450.0" y="355" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Cluster variability u = 0</text><rect x="990" y="200" width="720" height="340" rx="12" fill="#fff1e9" stroke="#dce3e8" stroke-width="2"/><text x="1350.0" y="242" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Interaction directions reinforce</text><text x="1350.0" y="283" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Group influences follow + - - +</text><text x="1350.0" y="319" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Signed component totals: -1/2 and +1/2</text><text x="1350.0" y="355" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Cluster variability u = 1</text><text x="900" y="700" font-size="32" text-anchor="middle" fill="#182b3a" font-weight="bold">Separate group variances would discard cross group covariance.</text><text x="900" y="770" font-size="30" text-anchor="middle" fill="#536473" font-weight="normal">The plug in scale is not a calibrated confidence radius.</text></g></svg>