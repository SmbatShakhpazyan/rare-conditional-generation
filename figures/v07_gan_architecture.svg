<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900"><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Liberation Sans, Arial, sans-serif"><text x="70" y="66" font-size="38" text-anchor="start" fill="#182b3a" font-weight="bold">The common residual conditional GAN</text><text x="70" y="108" font-size="25" text-anchor="start" fill="#536473" font-weight="normal">Both methods have the same learned architecture. C adds a separate fixed discriminator teacher.</text><rect x="110" y="355.0" width="240" height="150" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="230.0" y="397.0" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">128 channels</text><text x="230.0" y="438.0" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">4 x 4</text><line x1="355" y1="430" x2="415" y2="430" stroke="#536473" stroke-width="4"/><polyline points="400.59,436.96 415.00,430.00 400.59,423.04" fill="none" stroke="#536473" stroke-width="4"/><rect x="425" y="342.5" width="240" height="175" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="545.0" y="384.5" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">128 channels</text><text x="545.0" y="425.5" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">8 x 8</text><line x1="670" y1="430" x2="730" y2="430" stroke="#536473" stroke-width="4"/><polyline points="715.59,436.96 730.00,430.00 715.59,423.04" fill="none" stroke="#536473" stroke-width="4"/><rect x="740" y="330.0" width="240" height="200" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="860.0" y="372.0" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">64 channels</text><text x="860.0" y="413.0" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">16 x 16</text><line x1="985" y1="430" x2="1045" y2="430" stroke="#536473" stroke-width="4"/><polyline points="1030.59,436.96 1045.00,430.00 1030.59,423.04" fill="none" stroke="#536473" stroke-width="4"/><rect x="1055" y="317.5" width="240" height="225" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1175.0" y="359.5" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">32 channels</text><text x="1175.0" y="400.5" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">32 x 32</text><line x1="1300" y1="430" x2="1360" y2="430" stroke="#536473" stroke-width="4"/><polyline points="1345.59,436.96 1360.00,430.00 1345.59,423.04" fill="none" stroke="#536473" stroke-width="4"/><rect x="1370" y="305.0" width="240" height="250" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1490.0" y="347.0" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">16 channels</text><text x="1490.0" y="388.0" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">64 x 64</text><text x="80" y="190" font-size="31" text-anchor="start" fill="#182b3a" font-weight="bold">G: Gaussian z in 128 dimensions + four condition labels</text><text x="80" y="620" font-size="29" text-anchor="start" fill="#182b3a" font-weight="normal">Shared BN -&gt; ReLU -&gt; 3 x 3 convolution -&gt; tanh; RGB output 3 x 64 x 64</text><text x="80" y="690" font-size="31" text-anchor="start" fill="#007b83" font-weight="bold">G 737,315 trainable parameters</text><text x="80" y="745" font-size="31" text-anchor="start" fill="#182b3a" font-weight="normal">D 888,545 trainable parameters; 128 dimensional sum pooled features</text><text x="80" y="805" font-size="29" text-anchor="start" fill="#536473" font-weight="normal">C teacher 888,545 fixed parameters; no extra trainable generator parameters</text></g></svg>