<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960"><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Liberation Sans, Arial, sans-serif"><text x="70" y="66" font-size="38" text-anchor="start" fill="#182b3a" font-weight="bold">A stronger conditional matching proposal remains untested</text><text x="70" y="108" font-size="25" text-anchor="start" fill="#536473" font-weight="normal">Prospective design only. No quality advantage or completed new experiment is claimed.</text><rect x="80" y="190" width="760" height="225" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="460.0" y="232" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Separate TRAIN representation</text><text x="460.0" y="273" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Fit on a separate training fold</text><text x="460.0" y="309" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Freeze parameters and normalization</text><rect x="960" y="190" width="760" height="225" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1340.0" y="232" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Per condition kernel targets</text><text x="1340.0" y="273" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Positive weights for every condition</text><text x="1340.0" y="309" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Use only identified target groups</text><rect x="80" y="520" width="760" height="225" rx="12" fill="#f1eef7" stroke="#dce3e8" stroke-width="2"/><text x="460.0" y="562" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Validation and untouched test</text><text x="460.0" y="603" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Declare all search costs and seeds</text><text x="460.0" y="639" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Evaluate after recipe selection</text><rect x="960" y="520" width="760" height="225" rx="12" fill="#f1eef7" stroke="#dce3e8" stroke-width="2"/><text x="1340.0" y="562" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Fresh batch discrepancy</text><text x="1340.0" y="603" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Independent paired batches</text><text x="1340.0" y="639" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Off diagonal kernel estimates</text><line x1="840" y1="300" x2="950" y2="300" stroke="#536473" stroke-width="4"/><polyline points="935.59,306.96 950.00,300.00 935.59,293.04" fill="none" stroke="#536473" stroke-width="4"/><line x1="1330" y1="415" x2="1330" y2="510" stroke="#536473" stroke-width="4"/><polyline points="1323.04,495.59 1330.00,510.00 1336.96,495.59" fill="none" stroke="#536473" stroke-width="4"/><line x1="950" y1="635" x2="850" y2="635" stroke="#536473" stroke-width="4"/><polyline points="864.41,628.04 850.00,635.00 864.41,641.96" fill="none" stroke="#536473" stroke-width="4"/><text x="900" y="900" font-size="27" text-anchor="middle" fill="#182b3a" font-weight="normal">Zero characteristic kernel MMD identifies its target space, not automatically image semantics.</text></g></svg>