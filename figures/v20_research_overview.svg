<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150"><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Liberation Sans, Arial, sans-serif"><text x="70" y="66" font-size="38" text-anchor="start" fill="#182b3a" font-weight="bold">Rare conditional generation research overview</text><text x="70" y="108" font-size="25" text-anchor="start" fill="#536473" font-weight="normal">A complete methods report, a negative short budget experiment, and an explicit roadmap for stronger tests.</text><rect x="65" y="175" width="780" height="215" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="455.0" y="217" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">The empirical question</text><text x="455.0" y="258" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Can a TRAIN only signed feature correction</text><text x="455.0" y="294" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">improve the rare observed annotation condition?</text><rect x="955" y="175" width="780" height="215" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1345.0" y="217" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">The comparison</text><text x="1345.0" y="258" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Balanced conditional GAN B vs corrected GAN C</text><text x="1345.0" y="294" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Same backbone, updates and paired seeds</text><rect x="65" y="485" width="780" height="225" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="455.0" y="527" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">What was measured</text><text x="455.0" y="568" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">112,615 TRAIN / 23,156 VAL / 25,217 TEST</text><text x="455.0" y="604" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Ten validation checkpoints and six test models</text><rect x="955" y="485" width="780" height="225" rx="12" fill="#fff1e9" stroke="#dce3e8" stroke-width="2"/><text x="1345.0" y="527" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">What the result says</text><text x="1345.0" y="568" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Rare KID x 1000: B 166.663 / C 185.544</text><text x="1345.0" y="604" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">C does not demonstrate improvement</text><line x1="845" y1="280" x2="945" y2="280" stroke="#536473" stroke-width="4"/><polyline points="930.59,286.96 945.00,280.00 930.59,273.04" fill="none" stroke="#536473" stroke-width="4"/><line x1="1345" y1="400" x2="1345" y2="475" stroke="#536473" stroke-width="4"/><polyline points="1338.04,460.59 1345.00,475.00 1351.96,460.59" fill="none" stroke="#536473" stroke-width="4"/><line x1="855" y1="595" x2="945" y2="595" stroke="#536473" stroke-width="4"/><polyline points="930.59,601.96 945.00,595.00 930.59,588.04" fill="none" stroke="#536473" stroke-width="4"/><text x="900" y="840" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="bold">Reviewed model families are explained; only B and C supply this benchmark.</text><text x="900" y="905" font-size="29" text-anchor="middle" fill="#536473" font-weight="normal">No global novelty, general convergence, semantic fairness or full replay claim.</text><text x="900" y="1005" font-size="29" text-anchor="middle" fill="#007b83" font-weight="normal">Paper + original reference code + aggregate records + four recovered generators</text></g></svg>