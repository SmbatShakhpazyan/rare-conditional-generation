<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1170" viewBox="0 0 1800 1170"><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Liberation Sans, Arial, sans-serif"><text x="70" y="66" font-size="38" text-anchor="start" fill="#182b3a" font-weight="bold">Generative model mechanisms</text><text x="70" y="108" font-size="25" text-anchor="start" fill="#536473" font-weight="normal">Conceptual map of the reviewed families; these are not additional trained benchmark arms.</text><rect x="70" y="160" width="530" height="250" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="335.0" y="202" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">VAE</text><text x="335.0" y="243" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Log likelihood lower bound</text><text x="335.0" y="279" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Sample prior and decoder</text><rect x="640" y="160" width="530" height="250" rx="12" fill="#f1eef7" stroke="#dce3e8" stroke-width="2"/><text x="905.0" y="202" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Conditional GAN</text><text x="905.0" y="243" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Adversarial game</text><text x="905.0" y="279" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">One generator forward</text><rect x="1210" y="160" width="530" height="250" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1475.0" y="202" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Autoregressive</text><text x="1475.0" y="243" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Normalized factors</text><text x="1475.0" y="279" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Sequential ancestral draws</text><rect x="70" y="470" width="530" height="250" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="335.0" y="512" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Real NVP flow</text><text x="335.0" y="553" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Change of variables</text><text x="335.0" y="589" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Invert the learned map</text><rect x="640" y="470" width="530" height="250" rx="12" fill="#f1eef7" stroke="#dce3e8" stroke-width="2"/><text x="905.0" y="512" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">DDPM diffusion</text><text x="905.0" y="553" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Noise-prediction loss</text><text x="905.0" y="589" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Discrete reverse chain</text><rect x="1210" y="470" width="530" height="250" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1475.0" y="512" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Score and SDE</text><text x="1475.0" y="553" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Denoising score loss</text><text x="1475.0" y="589" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Langevin or reverse SDE</text><rect x="70" y="780" width="530" height="250" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="335.0" y="822" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Flow matching</text><text x="335.0" y="863" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Velocity regression</text><text x="335.0" y="899" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">Integrate a learned ODE</text><rect x="640" y="780" width="530" height="250" rx="12" fill="#f1eef7" stroke="#dce3e8" stroke-width="2"/><text x="905.0" y="822" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Consistency</text><text 