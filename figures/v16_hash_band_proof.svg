<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900"><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Liberation Sans, Arial, sans-serif"><text x="70" y="66" font-size="38" text-anchor="start" fill="#182b3a" font-weight="bold">Why six hash bands cover the declared distance threshold</text><text x="70" y="108" font-size="25" text-anchor="start" fill="#536473" font-weight="normal">If at most four bits differ, at least two of six disjoint bands match exactly.</text><rect x="100" y="190" width="220" height="145" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="210.0" y="232" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Band 1</text><text x="210.0" y="273" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">11 bits</text><rect x="370" y="190" width="220" height="145" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="480.0" y="232" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Band 2</text><text x="480.0" y="273" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">11 bits</text><rect x="640" y="190" width="220" height="145" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="750.0" y="232" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Band 3</text><text x="750.0" y="273" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">11 bits</text><rect x="910" y="190" width="220" height="145" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1020.0" y="232" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Band 4</text><text x="1020.0" y="273" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">11 bits</text><rect x="1180" y="190" width="220" height="145" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1290.0" y="232" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Band 5</text><text x="1290.0" y="273" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">10 bits</text><rect x="1450" y="190" width="220" height="145" rx="12" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1560.0" y="232" font-size="29" text-anchor="middle" fill="#182b3a" font-weight="bold">Band 6</text><text x="1560.0" y="273" font-size="25" text-anchor="middle" fill="#182b3a" font-weight="normal">10 bits</text><rect x="105" y="470" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="245" y="512" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">1 + 2</text><rect x="435" y="470" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="575" y="512" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">1 + 3</text><rect x="765" y="470" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="905" y="512" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">1 + 4</text><rect x="1095" y="470" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1235" y="512" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">1 + 5</text><rect x="1425" y="470" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1565" y="512" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">1 + 6</text><rect x="105" y="562" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="245" y="604" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">2 + 3</text><rect x="435" y="562" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="575" y="604" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">2 + 4</text><rect x="765" y="562" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="905" y="604" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">2 + 5</text><rect x="1095" y="562" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1235" y="604" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">2 + 6</text><rect x="1425" y="562" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1565" y="604" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">3 + 4</text><rect x="105" y="654" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="245" y="696" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">3 + 5</text><rect x="435" y="654" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="575" y="696" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">3 + 6</text><rect x="765" y="654" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="905" y="696" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">4 + 5</text><rect x="1095" y="654" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1235" y="696" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">4 + 6</text><rect x="1425" y="654" width="280" height="65" rx="7" fill="#eaf4f4" stroke="#dce3e8" stroke-width="2"/><text x="1565" y="696" font-size="31" text-anchor="middle" fill="#182b3a" font-weight="normal">5 + 6</text><text x="900" y="825" font-size="28" text-anchor="middle" fill="#182b3a" font-weight="normal">All 15 band pairs are indexed; aligned RGB checks then decide the declared relation.</text></g></svg>