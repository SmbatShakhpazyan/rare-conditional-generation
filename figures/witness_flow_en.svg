<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="650" viewBox="0 0 1800 650"><title>Fixed teacher and previous-state conditional interaction witness</title><desc>Six blocks show TRAIN-only reference data, the fixed B development teacher, fixed statistics, a balanced current generator batch, the lagged witness, and the auxiliary linear loss. A dashed connection updates the tracker only after a successful generator step, for later losses. The selected kappa is zero.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#516473" stroke-width="1.8"/></marker></defs><style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#172c3b}.head{font-size:33px;font-weight:700}.body{font-size:30px}.label{font-size:26px}.foot{font-size:25px}.edge{fill:none;stroke:#516473;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1800" height="650" fill="white"/><rect x="50" y="40" width="500" height="180" rx="18" fill="#edf3f7" stroke="#516473" stroke-width="2.5"/><text x="300" y="82" text-anchor="middle" class="head">TRAIN-ONLY DATA</text><text x="300" y="125" text-anchor="middle" class="body">Canonical RGB64 images</text><text x="300" y="162" text-anchor="middle" class="body">TRAIN split; repeated sampling</text><text x="300" y="199" text-anchor="middle" class="body">No validation / test images</text><rect x="650" y="40" width="500" height="180" rx="18" fill="#edf3f7" stroke="#516473" stroke-width="2.5"/><text x="900" y="82" text-anchor="middle" class="head">FIXED TEACHER ψ</text><text x="900" y="125" text-anchor="middle" class="body">Last B discriminator</text><text x="900" y="162" text-anchor="middle" class="body">Seed 909; 1,500 attempts</text><text x="900" y="199" text-anchor="middle" class="body">Frozen parameters; eval mode</text><rect x="1250" y="40" width="500" height="180" rx="18" fill="#edf3f7" stroke="#516473" stroke-width="2.5"/><text x="1500" y="82" text-anchor="middle" class="head">FIXED STATISTICS</text><text x="1500" y="125" text-anchor="middle" class="body">r: signed feature contrast</text><text x="1500" y="162" text-anchor="middle" class="body">s: scale; u: cluster variability</text><text x="1500" y="199" text-anchor="middle" class="body">One real TRAIN pass; not a CI</text><rect x="50" y="335" width="500" height="180" rx="18" fill="#edf6f1" stroke="#516473" stroke-width="2.5"/><text x="300" y="377" text-anchor="middle" class="head">CURRENT JOINT G BATCH</text><text x="300" y="420" text-anchor="middle" class="body">16 shared z × 4 conditions</text><text x="300" y="457" text-anchor="middle" class="body">Unaugmented ψ(G) → δ̂</text><text x="300" y="494" text-anchor="middle" class="body">G train-mode BN; d = 128</text><rect x="1250" y="335" width="500" height="180" rx="18" fill="#f1edf8" stroke="#516473" stroke-width="2.5"/><text x="1500" y="377" text-anchor="middle" class="head">PREVIOUS-STATE WITNESS</text><text x="1500" y="420" text-anchor="middle" class="body">q uses previous tracker m</text><text x="1500" y="457" text-anchor="middle" class="body">Warm-up: 500 successful G</text><text x="1500" y="494" text-anchor="middle" class="body">Selected κ = 0: tolerance off</text><rect x="650" y="335" width="500" height="180" rx="18" fill="#fff4e4" stroke="#516473" stroke-width="2.5"/><text x="900" y="377" text-anchor="middle" class="head">GENERATOR LOSS</text><text x="900" y="420" text-anchor="middle" class="body">Adversarial objective</text><text x="900" y="457" text-anchor="middle" class="body">+ detached linear witness term</text><text x="900" y="494" text-anchor="middle" class="body">Selected loss coefficient λ = 1</text><path class="edge" d="M550 125 H632"/><path class="edge" d="M1150 125 H1232"/><path class="edge" d="M900 220 V269 H300 V317"/><rect x="365" y="250" width="260" height="36" fill="white"/><text x="495" y="277" text-anchor="middle" class="label">fixed ψ; input gradient</text><path class="edge" d="M1500 220 V317"/><text x="1520" y="281" class="label">r, s, u</text><path class="edge" d="M550 425 H632"/><text x="591" y="407" text-anchor="middle" class="label">δ̂</text><path class="edge" d="M1250 425 H1168"/><text x="1208" y="407" text-anchor="middle" class="label">q</text><path class="edge" stroke-dasharray="10 7" d="M300 515 V575 H1500 V533"/><rect x="407" y="555" width="986" height="38" fill="white"/><text x="900" y="583" text-anchor="middle" class="label">AFTER successful G only: update m (β = 0.9); used by the NEXT loss</text><text x="900" y="629" text-anchor="middle" class="foot">q is detached. Gradients pass through ψ inputs to G; teacher tensors stay fixed. No efficacy guarantee.</text></svg>