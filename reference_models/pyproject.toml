[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-family-references"
version = "0.1.0"
description = "Original pedagogical PyTorch references for generative model families"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["genref*"]

